<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Project highlights</title>
<desc id="d">2,300 feature windows, 10 fault classes, 4 Non-IID edge clients, 2 to 16 client scaling, 4 algorithms, SHAP, 9 features, published on IEEE Xplore.</desc>
