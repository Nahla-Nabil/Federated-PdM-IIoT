<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">Experimental workflow</title>
<desc id="d">Feature extraction by the dataset provider; then load features, encode and scale, stratified split, centralized baseline, Dirichlet edge clients, cloud step, evaluation and SHAP.</desc>
<defs>
