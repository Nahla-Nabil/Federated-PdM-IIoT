<text x="48" y="94" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#A9B8D6" text-anchor="start">Conceptual design as described in the paper (Sec. III-D, Fig. 3). Clients are simulated partitions of the CWRU data.</text>
