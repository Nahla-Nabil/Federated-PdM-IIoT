<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Hybrid edge–cloud architecture as described in the paper</title>
<desc id="d">Four Non-IID edge clients train Random Forests (80 trees, depth 10). As described in the paper, clients send model parameters and sample counts to the cloud, which aggregates them with FedAvg (Eq. 2); the global model is evaluated on a 575-sample test set and explained with SHAP. Conceptual illustration.</desc>
